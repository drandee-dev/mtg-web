# Daily backend redeploy so the bundled Scryfall data (new cards + prices) tracks
# Scryfall's own daily bulk refresh — up to ~1 day stale instead of ~7. The deploy
# hook rebuilds the Vercel backend project, whose build step
# (backend/vercel_build.py) always downloads current bulk data.
name: Refresh card data

on:
  schedule:
    - cron: "0 9 * * *" # Daily 09:00 UTC
  workflow_dispatch: {}

jobs:
  redeploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy hook
        run: |
          if [ -z "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}" ]; then
            echo "VERCEL_DEPLOY_HOOK_URL secret is not set — skipping."
            exit 0
          fi
          curl -sf -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"

  # Supabase pauses a Free project after a week of too few database queries, and a
  # paused project took the site down (2026-11-25: 14 s health checks, no sign-in, no
  # AI spending cap). Each health call reads the usage table once; "a few requests
  # each day" is what their docs ask for. A red run here means tracking is down.
  keep-database-awake:
    runs-on: ubuntu-latest
    steps:
      - name: Read AI usage through the API
        run: |
          ok=0
          for i in 1 2 3; do
            body=$(curl -sf --max-time 30 https://mtg-workshop-api.vercel.app/api/health)
            echo "$body"
            # After a failed read the API asks nothing for 60 s, so wait that out.
            if echo "$body" | grep -q '"usage_tracking":"ok"'; then ok=1; else sleep 65; fi
          done
          [ "$ok" = 1 ]

[project]
name = "mtg-web-backend"
version = "0.1.0"
requires-python = ">=3.11"
# Vercel installs from this table (it takes precedence over requirements.txt).
# requirements.txt is local-dev only now (Render retired 2026-07-05) and adds
# uvicorn, which Vercel provides itself as the ASGI server.
dependencies = [
    "fastapi>=0.115",
    "anthropic>=0.52",
    "pyjwt>=2.8",
    "supabase>=2.9",
    "click>=8.0",
    "requests>=2.28",
    # ReDoS guard: timeout-capable engine for user-supplied regexes
    # (mtg_utils/_regex_guard.py) — stdlib `re` has no timeout.
    "regex>=2024.4.16",
]

# Vercel deploys app/main.py:app as a single Python Function (auto-detected
# entrypoint). The build script downloads + strips Scryfall data and pre-builds
# the pickle caches so cold starts load pickles instead of parsing raw JSON.
[tool.vercel.scripts]
build = "python vercel_build.py"
